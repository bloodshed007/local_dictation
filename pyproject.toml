[project]
name = "local-dictation"
version = "0.1.0"
description = "Local push-to-talk and toggle dictation for Windows using faster-whisper"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["dictation", "faster-whisper", "speech-to-text", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "deepgram-sdk==7.8.0",
    "faster-whisper==1.2.1",
    "Pillow==11.3.0",
    "pynput==1.8.1",
    "pystray==0.19.5",
    "python-dotenv==1.2.3",
    "sounddevice==0.5.6",
    "vosk==0.3.45",
]

[tool.uv]
# The launcher runs the source tree directly with `python -m realtime_stt`.
# uv manages dependencies and the .venv; no package installation is needed.
package = false
